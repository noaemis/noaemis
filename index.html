<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>revolution</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            overflow: hidden;
        }
        
        .hero-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            margin: auto;
            animation: fadeInUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .image-link {
            display: inline-block;
            text-decoration: none;
            cursor: pointer;
            animation: floating 3s ease-in-out infinite;
        }

        .floating-image {
            max-width: 450px;
            width: 80vw;
            height: auto;
            margin-bottom: 15px;
            transition: transform 0.4s ease-in-out; 
        }

        .image-link:hover .floating-image {
            transform: scale(1.12);
        }

        .subtitle {
            font-size: 1.1rem;
            color: #a0a0a0;
            margin-bottom: 35px;
            font-weight: 400;
        }

        .button-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        footer {
            width: 100%;
            display: flex;
            justify-content: flex-end; 
            padding: 20px 40px;
            font-size: 0.8rem;
            color: #555555;
        }


        footer a {
            color: #8e8e8e;
            text-decoration: none;
            margin-left: 20px;
            transition: color 0.2s ease;
        }

        footer a:hover {
            color: #ffffff;
        }

        @keyframes fadeInUp {
            0% {
                opacity: 0;
                transform: translateY(30px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes floating {
            0% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-12px);
            }
            100% {
                transform: translateY(0px);
            }
        }
    </style>
</head>
<body>

    <div></div>

    <div class="hero-container">
        <a href="https://discord.gg/vp8rhNRxDj" target="_blank" class="image-link">
            <img src="https://cdn.discordapp.com/attachments/1545007229986545764/1545402067215065220/flamingtext_com-3108768290.gif?ex=6a9cac15&is=6a9b5a95&hm=4d31907a6359c8e84cd6c223aba4e9cd637b2f82b7de94d5b4622a113b6cd794&" alt="Potassium" class="floating-image">
        </a>
        
        <p class="subtitle">discord best self bot</p>
        
        <div class="button-group">
        </div>
    </div>

    <footer>
        <div>
            <a href="https://discord.gg/vp8rhNRxDj" target="_blank">Discord</a>
            <a href="https://example.com/" target="_blank">Explanation</a>
        </div>
    </footer>

</body>
</html>
